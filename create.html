<!doctype html><html lang="es"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crear desde una idea · GCODE</title><link rel="stylesheet" href="/ui.css"><script src="/ui.js" defer></script><body data-page="create"><main class="app-main form-main"><h1>De una idea a una pieza</h1><p>Describe el problema, la audiencia y lo que quieres mostrar. El guion se guarda como borrador para editarlo antes de producir.</p><div class="card"><label>Marca</label><select id="brand"></select><label>Tu idea</label><textarea id="idea" placeholder="Un Reel sobre cómo registrar una orden sin cebolla para que cocina reciba la instrucción clara."></textarea><label>Formato</label><select id="kind"><option value="video">Video narrado</option><option value="imagen">Imagen</option><option value="carrusel">Carrusel</option><option value="historia_social">Historia vertical</option></select><div id="video-options"><label>Estilo de video</label><select id="style"><option value="historia">Historia ilustrada · pedidos y cocina</option><option value="comercial">Comercial · reportes</option><option value="consejo">Consejo rápido · reportes</option></select></div><div id="image-options" hidden><label>Tema para imágenes y carruseles</label><select id="topic"></select></div><label><input type="checkbox" id="paid"> Permitir la generación del guion por IA (reserva de presupuesto: US$0.10).</label><button id="create">Crear borrador</button><p id="status" role="status"></p></div><section id="result" hidden><h2>Borrador creado</h2><p id="warnings"></p><a id="edit">Abrir en el editor</a><pre id="script"></pre></section></main><script>
const $=id=>document.getElementById(id);let key=null,previous='';fetch('/api/feed/catalog').then(r=>r.json()).then(d=>{for(const t of d.topics){const o=document.createElement('option');o.value=t.id;o.textContent=t.titulo;$('topic').append(o)}});
const params=new URLSearchParams(location.search);if(params.get('idea'))$('idea').value=params.get('idea');if(['video','imagen','carrusel','historia_social'].includes(params.get('kind')))$('kind').value=params.get('kind');fetch('/api/marketing').then(r=>r.json()).then(d=>{for(const b of d.brands)$('brand').add(new Option(b.name,b.id));if(params.get('brand'))$('brand').value=params.get('brand')});
$('kind').onchange=()=>{$('video-options').hidden=$('kind').value!=='video';$('image-options').hidden=$('kind').value==='video'};
$('kind').onchange();
$('create').onclick=async()=>{const input={brand_id:$('brand').value||'comandpos',idea:$('idea').value,kind:$('kind').value,style:$('style').value,allow_paid:$('paid').checked,...($('kind').value!=='video'?{topic_id:$('topic').value}:{})};const body=JSON.stringify(input);if(body!==previous){key='idea-ui:'+crypto.randomUUID();previous=body}$('create').disabled=true;$('status').textContent='Preparando el guion y comprobando su estructura…';try{const r=await fetch('/api/ideas',{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':key},body});const d=await r.json();if(!r.ok)throw Error(d.error);$('result').hidden=false;$('warnings').textContent=d.warnings.join(' ');$('script').textContent=JSON.stringify(d.script,null,2);$('edit').href=(d.kind==='video'?'/editor.html':d.script.layout==='brand'?'/marketing.html':'/feed-editor.html')+'?project='+encodeURIComponent(d.script.nombre);$('status').textContent='Borrador guardado. Revisa el mensaje y los recursos antes de producir.'}catch(e){$('status').textContent=e.message}finally{$('create').disabled=false}};
</script></body></html>
