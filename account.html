<!doctype html><html lang="es"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cuenta · GCODE Studio</title><link rel="stylesheet" href="/ui.css"><script src="/ui.js" defer></script><body data-page="account"><main class="app-main account-main"><h1>Cuenta y acceso</h1><p id="me"></p><form id="password"><h2>Cambiar contraseña</h2><label>Contraseña actual<input name="current_password" type="password" autocomplete="current-password" required></label><label>Nueva contraseña · mínimo 14 caracteres<input name="password" type="password" autocomplete="new-password" minlength="14" required></label><button>Guardar y volver a entrar</button></form><form id="users" hidden><h2>Crear cuenta o restablecer acceso</h2><label>Usuario<input name="username" required></label><label>Contraseña inicial<input name="password" type="password" minlength="14" required></label><label>Permisos<select name="role"><option value="editor">Editor · crear y producir</option><option value="viewer">Lector · consultar</option><option value="admin">Administrador · aprobar y gestionar</option></select></label><button>Guardar cuenta</button><p id="list"></p></form><p id="status" role="status"></p><button id="logout">Cerrar sesión</button></main><script>
let me;const status=t=>document.querySelector('#status').textContent=t;fetch('/auth/me').then(r=>r.json()).then(async d=>{me=d;document.querySelector('#me').textContent=d.username+' · '+d.role;document.querySelector('#users').hidden=d.role!=='admin';if(d.role==='admin'){const u=await(await fetch('/api/accounts')).json();document.querySelector('#list').textContent=u.map(x=>x.username+' ('+x.role+')').join(' · ')}});
for(const id of ['password','users'])document.getElementById(id).onsubmit=async e=>{e.preventDefault();try{const data=Object.fromEntries(new FormData(e.target));if(id==='password')data.username=me.username;const r=await fetch('/auth/account',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),d=await r.json();if(!r.ok)throw Error(d.error);if(id==='password')location.href='/login';else status('Cuenta guardada.')}catch(e){status(e.message)}};
document.querySelector('#logout').onclick=async()=>{await fetch('/auth/logout',{method:'POST'});location.href='/login'};
</script></body></html>
